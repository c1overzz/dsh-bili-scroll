name: OpenClaw adapter
on:
  pull_request:
    paths: ['adapters/openclaw/**', 'vendor/bilibili-mcp/**', '.github/workflows/openclaw-adapter.yml']
  push:
    paths: ['adapters/openclaw/**', 'vendor/bilibili-mcp/**', '.github/workflows/openclaw-adapter.yml']
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r adapters/openclaw/requirements.lock
      - run: python -m unittest discover -s adapters/openclaw/tests -v
      - run: python adapters/openclaw/probe.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
